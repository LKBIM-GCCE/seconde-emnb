<section class="titre-seance"><h1>Vérifier un certificat</h1><p class="chapo">Page réservée à l'enseignant : recopie les informations lues sur le certificat.</p></section>
<section class="bloc"><form id="v" class="verif">
<label>Séance <select name="act"><option value="seq01-s1">seq01-s1 — Découvrir les acteurs de la construction</option><option value="seq01-s2">seq01-s2 — Les phases de l&#x27;acte de construire</option><option value="seq01-s3">seq01-s3 — Application croisée et résolution de problèmes</option><option value="seq01-s4">seq01-s4 — Jeu de rôle, transition numérique et évaluation</option><option value="seq02-s1">seq02-s1 — Découverte du dossier : plan de situation et plan de masse</option><option value="seq02-s2">seq02-s2 — Plans de niveaux et façades</option><option value="seq02-s3">seq02-s3 — Les coupes et les échelles</option><option value="seq02-s4">seq02-s4 — Analyse de l&#x27;évolution des plans : de l&#x27;esquisse à l&#x27;APD</option><option value="seq03-s1">seq03-s1 — Pourquoi l&#x27;IFC ? Jeu Mission IFC</option><option value="seq03-s2">seq03-s2 — Lire la maquette du projet</option><option value="seq03-s3">seq03-s3 — Répondre à l&#x27;économiste : tickets quantitatifs</option><option value="seq03-s4">seq03-s4 — Évaluation : les futurs bureaux de l&#x27;agence</option></select></label>
<label>Nom tel qu'écrit <input name="nom" required></label>
<label>Date (jj/mm/aaaa) <input name="date" required placeholder="29/10/2026"></label>
<label>Scores dans l'ordre, séparés par des espaces <input name="sc" required placeholder="7/8 15/16 20/22 11/12"></label>
<label>Code lu sur le certificat <input name="code" required placeholder="AB-12CD"></label>
<button class="btn">Vérifier</button></form><p id="vr" class="score"></p></section>
<script>
const IDS = {"seq01-s1": ["td01", "td02", "td03"], "seq01-s2": ["td04", "td05", "td06", "quiz"], "seq01-s3": ["bugs", "dossier", "tableau"], "seq01-s4": ["role", "bim", "qcm"], "seq02-s1": ["classer", "situation", "masse"], "seq02-s2": ["defi", "niveaux", "facades"], "seq02-s3": ["traits", "coupeA", "hauteurs", "echelles"], "seq02-s4": ["phase", "etude", "quiz"], "seq03-s1": ["lancement", "bilan"], "seq03-s2": ["flash", "prise", "identite", "tickets"], "seq03-s3": ["defi", "quanti", "ecarts"], "seq03-s4": ["t1", "t2-source", "t4-objets", "t2-valeur", "t3", "t4-total", "vigilance"]};
function code(t){let x=2166136261;for(const ch of t+"|emnb-urbain-vitry"){x^=ch.charCodeAt(0);x=Math.imul(x,16777619)>>>0;}const s=x.toString(36).toUpperCase().padStart(7,"0");return s.slice(0,2)+"-"+s.slice(2,6);}
document.getElementById("v").onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);const act=f.get("act");
const sc=f.get("sc").trim().split(/\s+/);const ligne=IDS[act].map((id,k)=>id+":"+(sc[k]||"")).join(";");
const ok=code(act+"|"+f.get("nom").trim()+"|"+ligne+"|"+f.get("date").trim())===f.get("code").trim().toUpperCase();
const r=document.getElementById("vr");r.textContent=ok?"✔ Certificat authentique":"✘ Le code ne correspond pas : certificat modifié ou mal recopié";r.className="score "+(ok?"ok":"ko");};
</script></main>
